[project]
name = "clinical-deid"
version = "0.1.0"
description = "Cascade de-identification (NER model + LLM) of Spanish clinical notes. TFM, BIG school."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Agustín Rovira" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.44.9",
    "fastapi>=0.162.2",
    "mangum>=0.22.0",
    "pydantic-settings>=2.6",
    "torch>=2.15.0",
    "transformers>=5.23.0",
]
# Application dependencies (fastapi, transformers, boto3…) are added from task T1.3 onwards with `uv add`.

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pre-commit>=3",
    "httpx>=0.28.1",
]
train = [
    "accelerate>=1.15.0",
    "huggingface-hub>=2.4.0",
    "seqeval>=1.2.2",
    "transformers>=5.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinical_deid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra -m 'not integration'"
markers = [
    "security: tests for security controls (OWASP, privacy)",
    "integration: need the real model or AWS; not run in CI by default",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]  # assert in tests

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["S603", "S607"]  # subprocess calls to gh

# CPU-only torch: the Lambda image has no GPU, and the default PyPI wheels pull ~4 GB of CUDA
# libraries. `explicit` means this index is used only for the packages mapped to it below.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
