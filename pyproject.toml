[project]
name = "clinical-deid"
version = "0.1.0"
description = "Cascade de-identification (NER model + LLM) of Spanish clinical notes. TFM, BIG school."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Agustín Rovira" }]
requires-python = ">=3.11,<3.12"
dependencies = []
# Application dependencies (fastapi, transformers, boto3…) are added from task T1.3 onwards with `uv add`.

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pre-commit>=3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinical_deid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -m 'not integration'"
markers = [
    "security: tests for security controls (OWASP, privacy)",
    "integration: need the real model or AWS; not run in CI by default",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]  # assert in tests

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["S603", "S607"]  # subprocess calls to gh
