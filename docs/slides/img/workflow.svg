<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>AI-assisted workflow: specs, then /implement-task with an approved plan, tests first, code and verification, a PR merged by the author, and /close-session</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#4b4b4b"/>
    </marker>
  </defs>
  <rect width="1200" height="300" fill="#ffffff"/>

  <rect x="20" y="70" width="170" height="110" rx="14" fill="#fafafa" stroke="#4b4b4b" stroke-width="2"/>
  <text x="105" y="106" text-anchor="middle" font-size="17" font-weight="700" fill="#111">Specs</text>
  <text x="105" y="130" text-anchor="middle" font-size="14" fill="#4b4b4b">requirements →</text>
  <text x="105" y="150" text-anchor="middle" font-size="14" fill="#4b4b4b">design → tasks</text>
  <text x="105" y="170" text-anchor="middle" font-size="14" fill="#4b4b4b">+ 12 ADRs</text>
  <line x1="190" y1="125" x2="222" y2="125" stroke="#4b4b4b" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="228" y="30" width="600" height="190" rx="18" fill="#fff6f0" stroke="#f25c19" stroke-width="2.5" stroke-dasharray="10 6"/>
  <text x="248" y="60" font-size="17" font-weight="700" fill="#c9430c">/implement-task Tn.m · one session per task</text>

  <rect x="248" y="85" width="128" height="80" rx="12" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="312" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#111">plan</text>
  <text x="312" y="142" text-anchor="middle" font-size="13" fill="#4b4b4b">&lt; 15 lines</text>
  <line x1="376" y1="125" x2="396" y2="125" stroke="#4b4b4b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="402" y="85" width="128" height="80" rx="12" fill="#c9430c"/>
  <text x="466" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">author "ok"</text>
  <text x="466" y="142" text-anchor="middle" font-size="13" fill="#ffffff">or changes it</text>
  <line x1="530" y1="125" x2="550" y2="125" stroke="#4b4b4b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="556" y="85" width="118" height="80" rx="12" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="615" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#111">tests first</text>
  <text x="615" y="142" text-anchor="middle" font-size="13" fill="#4b4b4b">see them fail</text>
  <line x1="674" y1="125" x2="694" y2="125" stroke="#4b4b4b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="700" y="85" width="112" height="80" rx="12" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="756" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#111">code +</text>
  <text x="756" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#111">verify</text>
  <text x="528" y="200" text-anchor="middle" font-size="14" fill="#4b4b4b">plan mode for cascade, LLM adapter, auth and workflows · /security-review before relevant PRs</text>

  <line x1="828" y1="125" x2="860" y2="125" stroke="#4b4b4b" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="866" y="70" width="140" height="110" rx="14" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="936" y="110" text-anchor="middle" font-size="17" font-weight="700" fill="#111">PR</text>
  <text x="936" y="134" text-anchor="middle" font-size="14" fill="#4b4b4b">CI green,</text>
  <text x="936" y="154" text-anchor="middle" font-size="14" fill="#4b4b4b">author merges</text>
  <line x1="1006" y1="125" x2="1034" y2="125" stroke="#4b4b4b" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="1040" y="70" width="140" height="110" rx="14" fill="#fafafa" stroke="#4b4b4b" stroke-width="2"/>
  <text x="1110" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#111">/close-session</text>
  <text x="1110" y="128" text-anchor="middle" font-size="14" fill="#4b4b4b">hours log,</text>
  <text x="1110" y="148" text-anchor="middle" font-size="14" fill="#4b4b4b">issue comment,</text>
  <text x="1110" y="168" text-anchor="middle" font-size="14" fill="#4b4b4b">memory</text>

  <path d="M1110 180 V265 H105 V186" fill="none" stroke="#4b4b4b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/>
  <text x="608" y="256" text-anchor="middle" font-size="14" fill="#4b4b4b">next task · scope change → new ADR + spec update first</text>
</svg>
