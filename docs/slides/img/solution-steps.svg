<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>The solution in three steps: paste a note, detect and verify the personal data, take the safe note away</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#f25c19"/>
    </marker>
  </defs>
  <rect width="1200" height="470" fill="#ffffff"/>

  <!-- connecting thread -->
  <path d="M330 120 C 370 80, 410 80, 450 120" fill="none" stroke="#f25c19" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/>
  <path d="M750 120 C 790 80, 830 80, 870 120" fill="none" stroke="#f25c19" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/>

  <!-- ===== Step 01 ===== -->
  <text x="40" y="70" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="64" font-weight="800" fill="#f25c19">01</text>
  <!-- illustration: a note being pasted -->
  <g fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 30 h120 l30 30 v120 h-150 z"/>
    <path d="M270 30 v30 h30"/>
    <line x1="170" y1="80" x2="270" y2="80"/>
    <line x1="170" y1="100" x2="250" y2="100"/>
    <line x1="170" y1="120" x2="275" y2="120"/>
    <line x1="170" y1="140" x2="240" y2="140"/>
    <line x1="170" y1="160" x2="262" y2="160"/>
  </g>
  <line x1="40" y1="200" x2="330" y2="200" stroke="#111" stroke-width="2"/>
  <text x="40" y="244" font-family="Roboto Slab, Rockwell, Georgia, serif" font-size="28" font-weight="700" fill="#111">Paste a note</text>
  <text x="40" y="276" font-size="18" fill="#4b4b4b">One note, up to 10,000 characters,</text>
  <text x="40" y="300" font-size="18" fill="#4b4b4b">as text or a .txt file.</text>
  <text x="40" y="330" font-family="Roboto Slab, Rockwell, Georgia, serif" font-size="19" font-style="italic" fill="#111">Nothing is stored.</text>
  <rect x="40" y="356" width="300" height="94" rx="12" fill="#fafafa" stroke="#ececec" stroke-width="2"/>
  <g font-family="Consolas, Cascadia Mono, monospace" font-size="16" fill="#111">
    <text x="56" y="386">Paciente Lucía Fernández,</text>
    <text x="56" y="410">ingresó el 12/03/2025 en el</text>
    <text x="56" y="434">H. Miguel Servet…</text>
  </g>

  <!-- ===== Step 02 ===== -->
  <text x="460" y="70" font-size="64" font-weight="800" fill="#f25c19">02</text>
  <!-- illustration: magnifier over lines, one highlighted -->
  <g fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="570" y1="60" x2="700" y2="60"/>
    <line x1="570" y1="90" x2="680" y2="90"/>
    <line x1="570" y1="120" x2="705" y2="120"/>
    <line x1="570" y1="150" x2="660" y2="150"/>
    <circle cx="660" cy="105" r="34"/>
    <line x1="684" y1="129" x2="716" y2="164" stroke-width="4"/>
  </g>
  <rect x="628" y="83" width="54" height="14" rx="4" fill="#f25c19" opacity="0.55"/>
  <line x1="460" y1="200" x2="750" y2="200" stroke="#111" stroke-width="2"/>
  <text x="460" y="244" font-family="Roboto Slab, Rockwell, Georgia, serif" font-size="28" font-weight="700" fill="#111">Detect and verify</text>
  <text x="460" y="276" font-size="18" fill="#4b4b4b">Our model finds the personal data;</text>
  <text x="460" y="300" font-size="18" fill="#4b4b4b">only doubtful items are checked,</text>
  <text x="460" y="330" font-family="Roboto Slab, Rockwell, Georgia, serif" font-size="19" font-style="italic" fill="#111">one sentence at a time.</text>
  <rect x="460" y="356" width="300" height="94" rx="12" fill="#fafafa" stroke="#ececec" stroke-width="2"/>
  <g font-size="15">
    <rect x="474" y="368" width="150" height="26" rx="6" fill="#fde2e4"/>
    <text x="482" y="386" fill="#8a1c2b" font-weight="700">Lucía Fernández</text>
    <text x="634" y="386" fill="#155e3b" font-weight="700">0.99 → mask</text>
    <rect x="474" y="408" width="150" height="26" rx="6" fill="#dff5ea"/>
    <text x="482" y="426" fill="#155e3b" font-weight="700">H. Miguel Servet</text>
    <text x="634" y="426" fill="#c9430c" font-weight="700">0.71 → LLM</text>
  </g>

  <!-- ===== Step 03 ===== -->
  <text x="880" y="70" font-size="64" font-weight="800" fill="#f25c19">03</text>
  <!-- illustration: safe note with a check -->
  <g fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M990 30 h120 l30 30 v120 h-150 z"/>
    <path d="M1110 30 v30 h30"/>
    <line x1="1010" y1="80" x2="1040" y2="80"/>
    <line x1="1010" y1="110" x2="1050" y2="110"/>
    <line x1="1010" y1="140" x2="1030" y2="140"/>
    <circle cx="1140" cy="160" r="26" fill="#ffffff"/>
    <path d="M1127 160 l9 9 l17 -19" stroke="#f25c19" stroke-width="4"/>
  </g>
  <rect x="1046" y="73" width="54" height="14" rx="4" fill="#f25c19"/>
  <rect x="1056" y="103" width="44" height="14" rx="4" fill="#f25c19"/>
  <rect x="1036" y="133" width="64" height="14" rx="4" fill="#f25c19"/>
  <line x1="880" y1="200" x2="1170" y2="200" stroke="#111" stroke-width="2"/>
  <text x="880" y="244" font-family="Roboto Slab, Rockwell, Georgia, serif" font-size="28" font-weight="700" fill="#111">Take it away</text>
  <text x="880" y="276" font-size="18" fill="#4b4b4b">Review the colour-coded categories,</text>
  <text x="880" y="300" font-size="18" fill="#4b4b4b">then copy or download the note.</text>
  <text x="880" y="330" font-family="Roboto Slab, Rockwell, Georgia, serif" font-size="19" font-style="italic" fill="#111">Ready for any LLM.</text>
  <rect x="880" y="356" width="300" height="94" rx="12" fill="#fff6f0" stroke="#ffd0b8" stroke-width="2"/>
  <g font-family="Consolas, Cascadia Mono, monospace" font-size="16" fill="#111">
    <text x="896" y="386">Paciente <tspan fill="#c9430c" font-weight="700">[NAME]</tspan>,</text>
    <text x="896" y="410">ingresó el <tspan fill="#c9430c" font-weight="700">[DATE]</tspan> en el</text>
    <text x="896" y="434"><tspan fill="#c9430c" font-weight="700">[LOCATION]</tspan>…</text>
  </g>
</svg>
