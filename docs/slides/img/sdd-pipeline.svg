<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>From idea to code: feasibility session, requirements, design, tasks, GitHub issues, one coding session per task</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#4b4b4b"/>
    </marker>
  </defs>
  <rect width="1200" height="420" fill="#ffffff"/>

  <!-- 1 feasibility -->
  <rect x="20" y="40" width="210" height="230" rx="14" fill="#fafafa" stroke="#4b4b4b" stroke-width="2"/>
  <text x="125" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#c9430c">17–18 Oct</text>
  <text x="125" y="78" text-anchor="middle" font-size="19" font-weight="700" fill="#111">Feasibility</text>
  <text x="125" y="102" text-anchor="middle" font-size="14" fill="#4b4b4b">dialogue with the AI</text>
  <text x="125" y="146" text-anchor="middle" font-size="40" font-weight="800" fill="#f25c19">8</text>
  <text x="125" y="170" text-anchor="middle" font-size="14" fill="#4b4b4b">rounds: goal, data, model,</text>
  <text x="125" y="188" text-anchor="middle" font-size="14" fill="#4b4b4b">LLM, deploy, security…</text>
  <text x="125" y="232" text-anchor="middle" font-size="40" font-weight="800" fill="#f25c19">51</text>
  <text x="125" y="256" text-anchor="middle" font-size="14" fill="#4b4b4b">decisions, then frozen</text>
  <line x1="230" y1="155" x2="256" y2="155" stroke="#4b4b4b" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- 2 requirements -->
  <rect x="262" y="40" width="210" height="230" rx="14" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="367" y="78" text-anchor="middle" font-size="19" font-weight="700" fill="#111">requirements.md</text>
  <text x="367" y="102" text-anchor="middle" font-size="14" fill="#4b4b4b">what and why</text>
  <text x="367" y="140" text-anchor="middle" font-size="16" fill="#111">13 FR · 9 NFR · 7 AC</text>
  <rect x="290" y="160" width="154" height="28" rx="6" fill="#dff5ea"/><text x="367" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#155e3b">DECIDED: build it</text>
  <rect x="290" y="194" width="154" height="28" rx="6" fill="#fff0d6"/><text x="367" y="214" text-anchor="middle" font-size="14" font-weight="700" fill="#7a4a00">PROPOSED: not final</text>
  <rect x="290" y="228" width="154" height="28" rx="6" fill="#fde2e4"/><text x="367" y="248" text-anchor="middle" font-size="14" font-weight="700" fill="#8a1c2b">PENDING: do not build</text>
  <line x1="472" y1="155" x2="498" y2="155" stroke="#4b4b4b" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- 3 design -->
  <rect x="504" y="40" width="190" height="230" rx="14" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="599" y="78" text-anchor="middle" font-size="19" font-weight="700" fill="#111">design.md</text>
  <text x="599" y="102" text-anchor="middle" font-size="14" fill="#4b4b4b">how</text>
  <text x="599" y="144" text-anchor="middle" font-size="15" fill="#111">ports, cascade,</text>
  <text x="599" y="166" text-anchor="middle" font-size="15" fill="#111">API contract,</text>
  <text x="599" y="188" text-anchor="middle" font-size="15" fill="#111">AWS plan, budget</text>
  <text x="599" y="236" text-anchor="middle" font-size="14" fill="#c9430c">+ ADRs for changes</text>
  <line x1="694" y1="155" x2="720" y2="155" stroke="#4b4b4b" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- 4 tasks -->
  <rect x="726" y="40" width="210" height="230" rx="14" fill="#ffe7da" stroke="#c9430c" stroke-width="2.5"/>
  <text x="831" y="78" text-anchor="middle" font-size="19" font-weight="700" fill="#111">tasks.md</text>
  <text x="831" y="102" text-anchor="middle" font-size="14" fill="#4b4b4b">when and done-when</text>
  <text x="831" y="146" text-anchor="middle" font-size="40" font-weight="800" fill="#c9430c">26</text>
  <text x="831" y="170" text-anchor="middle" font-size="14" fill="#4b4b4b">tasks in 5 weekly milestones</text>
  <text x="831" y="210" text-anchor="middle" font-size="14" fill="#111">each: hours · spec link ·</text>
  <text x="831" y="230" text-anchor="middle" font-size="14" fill="#111">a checkable "Done when"</text>
  <line x1="936" y1="155" x2="962" y2="155" stroke="#4b4b4b" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- 5 issues -->
  <rect x="968" y="40" width="212" height="230" rx="14" fill="#fafafa" stroke="#4b4b4b" stroke-width="2"/>
  <text x="1074" y="78" text-anchor="middle" font-size="19" font-weight="700" fill="#111">GitHub</text>
  <text x="1074" y="102" text-anchor="middle" font-size="14" fill="#4b4b4b">generated by a script</text>
  <text x="1074" y="144" text-anchor="middle" font-size="15" fill="#111">1 issue per task</text>
  <text x="1074" y="166" text-anchor="middle" font-size="15" fill="#111">Projects board</text>
  <text x="1074" y="188" text-anchor="middle" font-size="15" fill="#111">milestone = week</text>
  <text x="1074" y="236" text-anchor="middle" font-size="14" fill="#c9430c">session log per issue</text>

  <!-- bottom: the agent's rule -->
  <rect x="20" y="300" width="1160" height="100" rx="14" fill="#fff6f0" stroke="#f25c19" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="600" y="338" text-anchor="middle" font-size="18" font-weight="700" fill="#111">Rule for the agent (AGENTS.md): read requirements → design → tasks before coding.</text>
  <text x="600" y="368" text-anchor="middle" font-size="17" fill="#111">Implement only tasks that exist. Missing task or ambiguous spec → <tspan font-weight="700" fill="#c9430c">stop and ask</tspan>. Never invent requirements.</text>
</svg>
