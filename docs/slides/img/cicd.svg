<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>CI/CD: push runs ruff and pytest; deploy builds the image with the pinned model, smoke-tests it, pushes to ECR and updates Lambda through OIDC</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#4b4b4b"/>
    </marker>
  </defs>
  <rect width="1200" height="260" fill="#ffffff"/>

  <rect x="20" y="95" width="120" height="70" rx="12" fill="#fafafa" stroke="#4b4b4b" stroke-width="2"/>
  <text x="80" y="126" text-anchor="middle" font-size="17" font-weight="700" fill="#111">push / PR</text>
  <text x="80" y="148" text-anchor="middle" font-size="13" fill="#4b4b4b">GitHub</text>

  <path d="M140 115 H170 V50 H200" fill="none" stroke="#4b4b4b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="206" y="20" width="190" height="60" rx="12" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="301" y="46" text-anchor="middle" font-size="16" font-weight="700" fill="#111">ci.yml</text>
  <text x="301" y="68" text-anchor="middle" font-size="14" fill="#4b4b4b">ruff + pytest</text>

  <path d="M140 145 H170 V200 H200" fill="none" stroke="#4b4b4b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="206" y="170" width="150" height="60" rx="12" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="281" y="196" text-anchor="middle" font-size="16" font-weight="700" fill="#111">build image</text>
  <text x="281" y="218" text-anchor="middle" font-size="13" fill="#4b4b4b">deploy.yml</text>
  <line x1="356" y1="200" x2="384" y2="200" stroke="#4b4b4b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="390" y="170" width="170" height="60" rx="12" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="475" y="196" text-anchor="middle" font-size="16" font-weight="700" fill="#111">pinned model</text>
  <text x="475" y="218" text-anchor="middle" font-size="13" fill="#4b4b4b">from the Hub</text>
  <line x1="560" y1="200" x2="588" y2="200" stroke="#4b4b4b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="594" y="170" width="170" height="60" rx="12" fill="#ffe7da" stroke="#c9430c" stroke-width="2"/>
  <text x="679" y="196" text-anchor="middle" font-size="16" font-weight="700" fill="#111">smoke test</text>
  <text x="679" y="218" text-anchor="middle" font-size="13" fill="#4b4b4b">Lambda emulator, 401/200</text>
  <line x1="764" y1="200" x2="792" y2="200" stroke="#4b4b4b" stroke-width="2" marker-end="url(#a)"/>
  <text x="778" y="160" text-anchor="middle" font-size="13" fill="#c9430c">main only</text>

  <rect x="798" y="170" width="150" height="60" rx="12" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="873" y="196" text-anchor="middle" font-size="16" font-weight="700" fill="#111">push to ECR</text>
  <text x="873" y="218" text-anchor="middle" font-size="13" fill="#4b4b4b">tag = commit SHA</text>
  <line x1="948" y1="200" x2="976" y2="200" stroke="#4b4b4b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="982" y="170" width="198" height="60" rx="12" fill="#c9430c"/>
  <text x="1081" y="196" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">update Lambda</text>
  <text x="1081" y="218" text-anchor="middle" font-size="13" fill="#ffffff">OIDC role, no stored keys</text>
</svg>
