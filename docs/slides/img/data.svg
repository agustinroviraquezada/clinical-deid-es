<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>MEDDOCAN: 1,000 synthetic case reports split 500 train, 250 dev, 250 test; 22 entity types grouped into 8 categories; plus 5 synthetic notes in other styles</title>
  <rect width="1200" height="400" fill="#ffffff"/>

  <text x="20" y="38" font-size="20" font-weight="700" fill="#111">1,000 Spanish clinical case reports · synthetic personal data</text>
  <!-- split bar: 500 / 250 / 250 -->
  <rect x="20" y="58" width="580" height="70" rx="12" fill="#ffe7da" stroke="#c9430c" stroke-width="2"/>
  <text x="310" y="90" text-anchor="middle" font-size="20" font-weight="700" fill="#111">train · 500</text>
  <text x="310" y="114" text-anchor="middle" font-size="14" fill="#4b4b4b">fine-tuning on Colab</text>
  <rect x="610" y="58" width="285" height="70" rx="12" fill="#fff6f0" stroke="#c9430c" stroke-width="2"/>
  <text x="752" y="90" text-anchor="middle" font-size="20" font-weight="700" fill="#111">dev · 250</text>
  <text x="752" y="114" text-anchor="middle" font-size="14" fill="#4b4b4b">threshold t and N chosen here</text>
  <rect x="905" y="58" width="275" height="70" rx="12" fill="#c9430c"/>
  <text x="1042" y="90" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">test · 250</text>
  <text x="1042" y="114" text-anchor="middle" font-size="14" fill="#ffffff">used once, for the report</text>

  <text x="20" y="178" font-size="20" font-weight="700" fill="#111">22 MEDDOCAN types → 8 categories in the output</text>
  <g font-size="19" font-weight="700" font-family="Consolas, Cascadia Mono, monospace">
    <rect x="20" y="196" width="130" height="46" rx="10" fill="#fde2e4"/><text x="85" y="226" text-anchor="middle" fill="#8a1c2b">NAME</text>
    <rect x="166" y="196" width="130" height="46" rx="10" fill="#e2ecfd"/><text x="231" y="226" text-anchor="middle" fill="#1d3f8a">DATE</text>
    <rect x="312" y="196" width="150" height="46" rx="10" fill="#dff5ea"/><text x="387" y="226" text-anchor="middle" fill="#155e3b">LOCATION</text>
    <rect x="478" y="196" width="100" height="46" rx="10" fill="#efe4fb"/><text x="528" y="226" text-anchor="middle" fill="#5b2a8a">ID</text>
    <rect x="594" y="196" width="140" height="46" rx="10" fill="#fff0d6"/><text x="664" y="226" text-anchor="middle" fill="#7a4a00">CONTACT</text>
    <rect x="750" y="196" width="100" height="46" rx="10" fill="#dcf4f7"/><text x="800" y="226" text-anchor="middle" fill="#0f5a63">AGE</text>
    <rect x="866" y="196" width="170" height="46" rx="10" fill="#f3eadf"/><text x="951" y="226" text-anchor="middle" fill="#6b4421">PROFESSION</text>
    <rect x="1052" y="196" width="128" height="46" rx="10" fill="#e8eaef"/><text x="1116" y="226" text-anchor="middle" fill="#3a4256">OTHER</text>
  </g>

  <rect x="20" y="276" width="1160" height="104" rx="14" fill="#fafafa" stroke="#4b4b4b" stroke-width="1.5"/>
  <text x="44" y="312" font-size="18" font-weight="700" fill="#111">+ 5 hand-annotated synthetic notes in other styles</text>
  <text x="44" y="342" font-size="16" fill="#4b4b4b">progress note · emergency abbreviations · discharge report · nursing note · referral letter</text>
  <text x="44" y="366" font-size="16" fill="#4b4b4b">They test the domain gap. Corpus downloaded by script with an md5 check; never committed. No real patient data anywhere.</text>
</svg>
