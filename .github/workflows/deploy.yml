# Continuous deployment to AWS Lambda (design §9, ADR-0005).
#
# Job `build-test` builds the container image and smoke-tests it locally with the Lambda Runtime
# Interface Emulator (RIE). It has no access to AWS.
# Job `deploy` runs only on `main`, and only once the AWS resources exist (the repository variable
# AWS_DEPLOY_ROLE_ARN is set, see docs/deployment.md). It takes the exact image that was tested,
# pushes it to ECR and updates the Lambda function. Until then it is skipped, not failed.
#
# Third-party actions are pinned by full commit SHA (the comment shows the release): a tag can be
# moved to other code, a commit SHA cannot. This matters most in `deploy`, which holds AWS credentials.
name: Deploy

on:
  push:
    branches: [main]
  # Manual run from the Actions tab.
  workflow_dispatch:
  # Pull requests that change the image only build and smoke-test it; they never deploy.
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/deploy.yml
      - pyproject.toml
      - uv.lock
      - config/model.json
      - src/**

# Default for every job: read the repository and nothing else. Only `deploy` asks for more.
permissions:
  contents: read

# Never run two deployments at once, and never cancel one halfway through.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  IMAGE: clinical-deid:${{ github.sha }}
  # True only when the `deploy` job will run (same condition as its `if:`).
  WILL_DEPLOY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_DEPLOY_ROLE_ARN != '' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The model lives in a private Hugging Face repository. Download the exact revision pinned in
      # config/model.json (commit SHA, so the files cannot change under us) into ./model, which the
      # Dockerfile copies into the image. HF_TOKEN is a read-only token stored as a GitHub secret:
      # the `hf` CLI reads it from the environment and never prints it, and it is not passed to
      # `docker build`, so it never reaches the image. Only the files the app loads are fetched
      # (no pickled .bin files). The CLI version is pinned like any other dependency.
      - name: Download the pinned model from the Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::The HF_TOKEN secret is not available (docs/deployment.md, section 7)."
            exit 1
          fi
          repo_id=$(jq -r '.repo_id' config/model.json)
          revision=$(jq -r '.revision' config/model.json)
          # Only a full commit SHA is immutable; a branch or tag name could point elsewhere later.
          if ! [[ "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::config/model.json revision must be a full 40-character commit SHA."
            exit 1
          fi
          # Files are listed by name (not --include, which takes a single pattern).
          files="config.json model.safetensors tokenizer.json tokenizer_config.json"
          pipx run --spec 'huggingface-hub==2.4.0' hf download "$repo_id" $files \
            --revision "$revision" --local-dir model
          ls -la model
          for f in $files; do
            test -s "model/$f" || { echo "::error::model/$f was not downloaded."; exit 1; }
          done

      # Recent Docker versions attach provenance/SBOM attestations and wrap the image in a manifest
      # list. Lambda rejects that format ("image manifest ... media type is not supported"), so
      # build a plain single-platform image.
      - name: Build the container image
        run: docker build --provenance=false --sbom=false --tag "$IMAGE" .

      # The Lambda base image includes the RIE: it exposes the same "invoke" API as Lambda on
      # port 8080, so the real handler runs here exactly as it will in AWS.
      # The emulator gets a throwaway SESSION_SECRET, random per run: it only lives in this CI
      # container, is masked in the logs and never reaches the deployed Lambda or the repo.
      # The next step uses it to sign a session cookie for the protected route.
      - name: Smoke test /api/health through the Lambda emulator
        run: |
          SESSION_SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$SESSION_SECRET"
          echo "SESSION_SECRET=$SESSION_SECRET" >> "$GITHUB_ENV"
          docker run --detach --name lambda --publish 9000:8080             -e SESSION_SECRET="$SESSION_SECRET" "$IMAGE"
          cat > event.json <<'EOF'
          {
            "version": "2.0",
            "routeKey": "$default",
            "rawPath": "/api/health",
            "rawQueryString": "",
            "headers": {"host": "localhost"},
            "requestContext": {
              "http": {"method": "GET", "path": "/api/health", "protocol": "HTTP/1.1",
                       "sourceIp": "127.0.0.1", "userAgent": "smoke-test"},
              "requestId": "smoke-test", "routeKey": "$default", "stage": "$default"
            },
            "isBase64Encoded": false
          }
          EOF
          for attempt in 1 2 3 4 5; do
            if curl --silent --fail --output response.json \
                 --data @event.json \
                 http://localhost:9000/2015-03-31/functions/function/invocations; then
              break
            fi
            sleep 2
          done
          cat response.json; echo
          test "$(jq -r '.statusCode' response.json)" = "200"
          jq -r '.body' response.json | jq -e '.status == "ok"'

      # Same emulator, now through the real model: a synthetic note (invented, no real data) must
      # come back with the patient name masked. The route needs a session (T4.2), so:
      #   1. without a cookie it must answer 401 (the login gate is in the image);
      #   2. with a cookie signed by the app's own sign_session() it must answer 200.
      # The password login itself is covered by tests/test_auth.py. The first call that reaches
      # the model loads it (cold start), so it gets a generous timeout.
      - name: Smoke test /api/deidentify with the real model
        run: |
          note='Paciente Lucía Fernández, de 54 años, ingresó el 12/03/2025 en Teruel.'
          invoke() {
            # $1 = JSON array of cookies for the Function URL event (Mangum turns it into Cookie).
            jq -n --arg body "$(jq -cn --arg text "$note" '{text: $text}')" --argjson cookies "$1" '{
              version: "2.0", routeKey: "$default", rawPath: "/api/deidentify", rawQueryString: "",
              cookies: $cookies,
              headers: {host: "localhost", "content-type": "application/json"},
              requestContext: {
                http: {method: "POST", path: "/api/deidentify", protocol: "HTTP/1.1",
                       sourceIp: "127.0.0.1", userAgent: "smoke-test"},
                requestId: "smoke-test-deidentify", routeKey: "$default", stage: "$default"
              },
              body: $body, isBase64Encoded: false
            }' > deidentify.json
            curl --silent --fail --max-time 120 --output response.json               --data @deidentify.json               http://localhost:9000/2015-03-31/functions/function/invocations
          }

          invoke '[]'
          echo "Without a session: $(jq -r '.statusCode' response.json)"
          test "$(jq -r '.statusCode' response.json)" = "401"

          sign='import os, time; from clinical_deid.api.auth import sign_session as s; print(s(int(time.time()) + 600, os.environ["SESSION_SECRET"]))'
          token=$(docker run --rm --entrypoint python3 --workdir /var/task             -e SESSION_SECRET "$IMAGE" -c "$sign")
          echo "::add-mask::$token"
          invoke "$(jq -cn --arg c "deid_session=$token" '[$c]')"
          jq -r '.body' response.json | jq '{deidentified_text, metrics}'
          test "$(jq -r '.statusCode' response.json)" = "200"
          jq -r '.body' response.json | jq -e '.deidentified_text | contains("[NAME]")'
          jq -r '.body' response.json | jq -e '.deidentified_text | contains("Lucía") | not'
          # Punctuation next to an entity must survive masking.
          jq -r '.body' response.json | jq -e '.deidentified_text | contains("[NAME], de")'

      - name: Show the emulator logs if the smoke test failed
        if: failure()
        run: docker logs lambda || true

      # Hand the tested image to the `deploy` job as a file, so the image that is deployed is
      # byte-for-byte the one that passed the smoke test (no rebuild).
      - name: Save the tested image
        if: env.WILL_DEPLOY == 'true'
        run: docker save "$IMAGE" | gzip > image.tar.gz

      - name: Upload the tested image for the deploy job
        if: env.WILL_DEPLOY == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.tar.gz
          retention-days: 1

      - name: Explain why deployment is skipped
        if: github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN == ''
        run: echo "::notice::Deployment skipped — set the AWS_DEPLOY_ROLE_ARN repository variable (docs/deployment.md)."

  deploy:
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # GitHub environment limited to `main`. The AWS trust policy only accepts OIDC tokens issued
    # for this environment, so no other workflow, branch or job can assume the deploy role.
    environment: production
    # Only this job may request an OIDC token from GitHub.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the tested image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image

      - name: Load the image into Docker
        run: gunzip -c image.tar.gz | docker load

      - name: Authenticate to AWS with OIDC (no stored keys)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # ECR tags are immutable, so every run needs its own tag: <commit SHA>-<run id>-<attempt>.
      # The SHA keeps the commit traceable; the run id and attempt let a manual run or a re-run
      # of the same commit push a new image instead of failing on an existing tag.
      - name: Push the tested image to ECR (tagged with commit SHA and run)
        id: push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          uri="$REGISTRY/$REPOSITORY:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          docker tag "$IMAGE" "$uri"
          docker push "$uri"
          echo "uri=$uri" >> "$GITHUB_OUTPUT"

      # Skipped until LAMBDA_FUNCTION_NAME is set: the very first run only pushes the image,
      # because the function itself is created from an image that already exists in ECR.
      - name: Point the Lambda function at the new image and wait
        if: vars.LAMBDA_FUNCTION_NAME != ''
        env:
          FUNCTION: ${{ vars.LAMBDA_FUNCTION_NAME }}
          IMAGE_URI: ${{ steps.push.outputs.uri }}
        run: |
          aws lambda update-function-code --function-name "$FUNCTION" --image-uri "$IMAGE_URI" \
            --query 'LastUpdateStatus' --output text
          aws lambda wait function-updated --function-name "$FUNCTION"
